<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff"><title>TKC Fumigaciones | Navbar horizontal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--purple:#250044;--ink:#273044;--sky:#61c8f4;--muted:#64718a;--line:#e9ecf2;--page:#f9fbfd}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:'DM Sans',Arial,sans-serif;background:var(--page);color:var(--ink)}
.site-header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #ebedf1;box-shadow:0 6px 30px rgba(22,23,42,.045);animation:headerIn .7s cubic-bezier(.2,.8,.2,1) both}
.site-header::before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--purple) 0%,var(--purple) 68%,var(--sky) 68%,var(--sky) 100%)}
.navbar{height:94px;max-width:1510px;padding:0 clamp(22px,4.5vw,82px);margin:auto;display:flex;gap:clamp(20px,3vw,55px);align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;flex:0 0 auto;text-decoration:none}
.brand img{width:204px;height:auto;max-height:64px;object-fit:contain;transition:transform .35s ease}.brand:hover img{transform:scale(1.025)}
.nav-links{display:flex;align-items:center;gap:clamp(14px,1.9vw,31px);padding:0;margin:0;list-style:none;height:100%;margin-left:auto}
.nav-links>li{height:100%;display:flex;align-items:center;position:relative}
.nav-link{appearance:none;border:0;background:none;display:inline-flex;align-items:center;gap:6px;padding:11px 0;font:600 13.4px/1.3 'DM Sans',Arial,sans-serif;color:#344050;white-space:nowrap;cursor:pointer;text-decoration:none;position:relative;transition:color .2s}
.nav-link:after{content:"";position:absolute;left:0;right:0;bottom:3px;height:2px;border-radius:5px;background:var(--sky);transform:scaleX(0);transform-origin:left;transition:transform .24s}
.nav-link:hover,.nav-link:focus-visible,.nav-link.active,.has-dropdown.open>.nav-link{color:var(--purple)}
.nav-link:hover:after,.nav-link.active:after,.has-dropdown.open>.nav-link:after{transform:scaleX(1)}
.chevron{width:14px;height:14px;transition:transform .25s}.has-dropdown.open .chevron{transform:rotate(180deg)}
.contact-link{display:inline-flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;color:white;background:var(--purple);font-size:13px;font-weight:700;border-radius:8px;white-space:nowrap;padding:15px 20px;box-shadow:0 7px 15px rgba(37,0,68,.11);transition:transform .24s,box-shadow .24s,background .24s}
.contact-link:hover{transform:translateY(-2px);background:#3a0a60;box-shadow:0 12px 25px rgba(37,0,68,.19)}
.contact-link svg{width:15px;height:15px}
.dropdown{position:absolute;left:-26px;top:calc(100% - 7px);width:262px;padding:10px;background:#fff;border:1px solid #edf0f3;border-radius:14px;box-shadow:0 18px 45px rgba(30,23,61,.13);opacity:0;visibility:hidden;transform:translateY(-9px);transition:opacity .2s,transform .2s,visibility .2s}
.has-dropdown.open .dropdown{opacity:1;visibility:visible;transform:translateY(0)}
.dropdown:before{content:"";position:absolute;top:-6px;left:38px;width:10px;height:10px;transform:rotate(45deg);background:white;border-left:1px solid #edf0f3;border-top:1px solid #edf0f3}
.dropdown a{display:flex;gap:12px;align-items:center;text-decoration:none;color:#343b4d;font-size:13.5px;font-weight:600;padding:12px 13px;border-radius:8px;transition:background .2s,color .2s,transform .2s}
.dropdown a:hover,.dropdown a:focus-visible{background:#f5f9fd;color:var(--purple);transform:translateX(2px)}
.dropdown-mark{width:8px;height:8px;border-radius:2px;background:var(--sky);transform:rotate(45deg);flex:0 0 auto}
.dropdown a:nth-child(1) .dropdown-mark{background:#28004a}.dropdown a:nth-child(2) .dropdown-mark{background:#a3d76f}.dropdown a:nth-child(3) .dropdown-mark{background:#12a3bd}.dropdown a:nth-child(4) .dropdown-mark{background:#f3b03d}
.menu-toggle{display:none;border:1px solid #e9eaf0;border-radius:9px;background:white;color:var(--purple);width:44px;height:44px;align-items:center;justify-content:center;cursor:pointer}
.menu-toggle svg{width:22px;height:22px}
.stage{min-height:450vh;background:#ffffff;position:relative}

@keyframes headerIn{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1200px){.navbar{gap:12px;padding:0 28px}.nav-links{gap:15px}.nav-link{font-size:12px}.contact-link{font-size:12px;padding:14px 15px}.brand img{width:170px}}
@media(max-width:980px){.navbar{height:79px;padding:0 24px}.brand img{width:165px;height:auto;max-height:58px}.menu-toggle{display:flex;margin-left:auto}.nav-links{position:absolute;top:calc(100% - 1px);left:0;right:0;display:flex;flex-direction:column;align-items:stretch;gap:0;height:auto;background:white;margin:0;padding:12px 23px 24px;border-bottom:1px solid var(--line);box-shadow:0 24px 30px rgba(22,23,42,.08);visibility:hidden;opacity:0;transform:translateY(-8px);pointer-events:none;transition:.24s}.site-header.mobile-open .nav-links{visibility:visible;opacity:1;transform:translateY(0);pointer-events:auto}.nav-links>li{display:block;height:auto;border-bottom:1px solid #f0f1f4}.nav-links>li:last-child{border-bottom:0}.nav-link{width:100%;font-size:15px;padding:17px 3px;justify-content:space-between}.nav-link:after{display:none}.dropdown{position:static;display:none;width:100%;opacity:1;visibility:visible;transform:none;border:none;box-shadow:none;padding:0 0 12px 10px}.dropdown:before{display:none}.has-dropdown.open .dropdown{display:block}.contact-link{font-size:14px;padding:14px 19px}.stage{min-height:calc(100vh - 82px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body>

<script>
const header=document.getElementById('header');const menuToggle=document.getElementById('menuToggle');const linesItem=document.getElementById('linesItem');const linesToggle=document.getElementById('linesToggle');let timer;
function dropdown(state){linesItem.classList.toggle('open',state);linesToggle.setAttribute('aria-expanded',String(state));}
linesToggle.addEventListener('click',()=>dropdown(!linesItem.classList.contains('open')));
linesItem.addEventListener('mouseenter',()=>{if(window.matchMedia('(min-width:981px)').matches){clearTimeout(timer);dropdown(true);}});
linesItem.addEventListener('mouseleave',()=>{if(window.matchMedia('(min-width:981px)').matches){timer=setTimeout(()=>dropdown(false),130);}});
menuToggle.addEventListener('click',()=>{const state=!header.classList.contains('mobile-open');header.classList.toggle('mobile-open',state);menuToggle.setAttribute('aria-expanded',String(state));menuToggle.setAttribute('aria-label',state?'Cerrar menú':'Abrir menú');document.getElementById('menuIcon').innerHTML=state?'<path d="M5 5l14 14M19 5 5 19"/>':'<path d="M4 7h16M4 12h16M4 17h16"/>';});
document.addEventListener('click',e=>{if(!linesItem.contains(e.target))dropdown(false);if(e.target.closest('.nav-links a')){document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a===e.target));if(e.target.closest('.dropdown'))document.querySelectorAll('[data-nav]').forEach(a=>a.classList.remove('active'));if(window.matchMedia('(max-width:980px)').matches){header.classList.remove('mobile-open');menuToggle.setAttribute('aria-expanded','false');document.getElementById('menuIcon').innerHTML='<path d="M4 7h16M4 12h16M4 17h16"/>';}dropdown(false);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){dropdown(false);header.classList.remove('mobile-open');menuToggle.setAttribute('aria-expanded','false');}});
</script></body></html>
